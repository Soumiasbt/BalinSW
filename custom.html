<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Orders | Balin Swetty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Balin Swetty</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="custom.html" class="active">Custom Orders</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="menu.html" class="btn">Order Now</a>
    </nav>

    <section class="form-section" style="text-align: center;">
        <h2 style="font-size: 2.8rem; margin-bottom: 10px;">Custom Dessert Orders</h2>
        <p style="color: var(--text-muted); margin-bottom: 40px;">Large orders for events, weddings, and special celebrations.</p>

        <form action="https://api.web3forms.com/submit" method="POST" id="directOrderForm">

    <input type="hidden" name="access_key" value="bf10f721-9008-4cb7-b2a4-9941ea9876cc">
    
    <input type="hidden" name="redirect" value="https://balin-sw.vercel.app/">
        
        
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="Your beautiful name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" required placeholder="Contact Number">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="yourname@gmail.com">
            </div>
            <div class="form-group">
                <label>Event Type</label>
                <select name="eventType">
                    <option value="Birthday">Birthdays</option>
                    <option value="Wedding">Weddings</option>
                    <option value="Engagement">Engagements</option>
                    <option value="Corporate">Corporate Events</option>
                    <option value="Eid">Eid Celebrations</option>
                </select>
            </div>
            <div class="form-group">
                <label>Number of Guests</label>
                <input type="number" name="guests" min="1">
            </div>
            <div class="form-group">
                <label>Desired Date</label>
                <input type="date" name="date" required>
            </div>
            <div class="form-group">
                <label>Special Requests / Design Notes</label>
                <textarea name="message" rows="4" placeholder="Tell us your theme, flavor preferences, or aesthetic goals..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 15px;">Submit Request</button>
        </form>
    </section>

</body>
</html>
